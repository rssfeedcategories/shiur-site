name: probe (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1 || true
          for d in birkasshiur.com birkasavrohom.com birkasavrohom.org; do
            echo "::notice title=$d NS::$(dig +short NS $d | tr '\n' ' ') A: $(dig +short A $d | tr '\n' ' ')"
            echo "::notice title=$d whois::$(whois $d | grep -iE 'Registrar:|Registrar URL|Expiry|Expiration' | head -4 | tr '\r\n' '  ')"
          done
