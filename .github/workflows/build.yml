name: Rebuild site data from feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull feed and rebuild JSON
        run: python3 build_feed.py

      - name: Commit if anything changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Feed unchanged - nothing to commit."
            exit 0
          fi
          git add data
          git commit -m "Refresh episode data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected - syncing and retrying ($i of 3)"
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts"
          exit 1
